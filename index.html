<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="description" content="Pilotage de l'Elegoo Centauri Carbon 2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <title>Imprimante 3D</title>
  <script src="/theme-boot.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-id">
        <span class="topbar-dot" id="conn-dot"></span>
        <span class="topbar-name" id="printer-name">Centauri Carbon 2</span>
      </div>
      <div class="topbar-state" id="topbar-state"></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-theme" title="Thème" aria-label="Changer de thème"></button>
        <button class="icon-btn danger" id="btn-estop" title="Arrêt d'urgence" aria-label="Arrêt d'urgence"></button>
      </div>
    </header>

    <nav class="rail" id="nav" aria-label="Navigation"></nav>

    <main class="stage">
      <div class="banners" id="banners"></div>
      <div class="view" id="view"></div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
